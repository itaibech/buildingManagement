name: Deploy
on:
  push:
    branches: [main]
# Least privilege: jobs read the repo; only the deploy job may write Pages / mint the OIDC token.
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # Gate: the full CI (lint, typecheck, unit tests, build, pgTAP) must pass before anything touches prod.
  ci:
    uses: ./.github/workflows/ci.yml
  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  migrate:
    needs: ci
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.122.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
      - run: supabase db push -p "$SUPABASE_DB_PASSWORD"
      # After the migrations (it writes email_log). JWT verification stays on (supabase/config.toml). Its secrets are
      # set once by hand (README → Email setup); without them the function runs in dry run.
      - run: supabase functions deploy send-email --project-ref "$SUPABASE_PROJECT_REF"
      # Deletes a user's login (needs the service role, which the platform provides). Admins only; JWT verification on.
      - run: supabase functions deploy admin-delete-user --project-ref "$SUPABASE_PROJECT_REF"
      # Invites users by email (auth.admin.inviteUserByEmail needs the service role). Admins only; JWT verification on.
      # APP_URL (optional secret) is where the invite link lands; it defaults to the live site.
      - run: supabase functions deploy admin-invite-user --project-ref "$SUPABASE_PROJECT_REF"
      # Maintenance email reminders (0038): pg_cron calls it through pg_net once a day. No JWT (verify_jwt = false in
      # supabase/config.toml): it checks the x-cron-secret header against the secret the migration generated in the DB.
      - run: supabase functions deploy cron-reminders --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      # The database can't know its own functions URL, so the job stays idle until this sets it. Nothing secret is
      # handled or printed: the URL is public and the cron secret never leaves the database.
      - name: Point the cron job at the functions URL
        run: |
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "SUPABASE_PROJECT_REF has an unexpected format"; exit 1; }
          url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          supabase db query --linked "update private.cron_config set functions_url = '${url}', updated_at = now() where functions_url is distinct from '${url}'" > /dev/null
  deploy:
    needs: [build, migrate]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
