name: Keep-alive
# Free-tier Supabase projects pause after a week without API activity. Every 3 days, one anon REST read:
# RLS answers [] to anon, and the request still counts as activity.
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: keepalive
  cancel-in-progress: true
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          curl -fsS --retry 3 --max-time 30 -o /dev/null -w 'HTTP %{http_code}\n' \
            "$VITE_SUPABASE_URL/rest/v1/apartments?select=id&limit=1" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY"
